# DEVER Arena Web (nginx) — phục vụ SPA + proxy API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index app.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # PWA manifest đúng content-type
  location = /manifest.json {
    add_header Content-Type application/manifest+json;
    expires 1h;
  }

  # API sang backend (cùng compose service "api")
  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  # SSE stream: tắt buffer để event xuống ngay
  location /api/v1/stream/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # SPA fallback về app.html
  location / {
    try_files $uri $uri/ /app.html;
  }

  # Assets tĩnh cache dài (tên file đã hash)
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
